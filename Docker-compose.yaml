
version: '3.4'

services:
  dingoquadruped:
    image: dingo_ws
    network_mode: "host"
    privileged: true
    environment:
      BLINKA_JETSON_NANO: "1"
      DINGO_I2C_BUS: "1"
      DINGO_SERVO_ADDRESS: "0x40"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined   
    volumes:
      - ./dingo_ws:/dingo_ws
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    devices:
      - /dev/i2c-1:/dev/i2c-1
      - /dev:/dev
    build:
      context: .
      dockerfile: ./Dockerfile
    command: /bin/sh -c "while sleep 1000; do :; done"
